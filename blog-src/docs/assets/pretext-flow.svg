<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="760" height="250" rx="10" fill="#0c0e12" stroke="#3a3f47"/>
  <text x="24" y="34" fill="#8a8f98" font-size="12" letter-spacing="2">PRETEXT: MEASURE ONCE, LAY OUT FOR FREE</text>

  <rect x="24" y="60" width="150" height="64" rx="6" fill="none" stroke="#8a8f98"/>
  <text x="99" y="88" fill="#e8e6e1" font-size="13" text-anchor="middle">"Security</text>
  <text x="99" y="106" fill="#e8e6e1" font-size="13" text-anchor="middle">professional..."</text>

  <path d="M174 92 h36" stroke="#8a8f98" fill="none" marker-end="url(#a)"/>

  <rect x="212" y="52" width="180" height="80" rx="6" fill="none" stroke="#7ee2a8"/>
  <text x="302" y="78" fill="#7ee2a8" font-size="14" text-anchor="middle">prepare()</text>
  <text x="302" y="98" fill="#8a8f98" font-size="11" text-anchor="middle">segment · glue rules</text>
  <text x="302" y="114" fill="#8a8f98" font-size="11" text-anchor="middle">canvas-measure · cache</text>

  <path d="M392 92 h36" stroke="#8a8f98" fill="none" marker-end="url(#a)"/>

  <rect x="430" y="52" width="180" height="80" rx="6" fill="none" stroke="#8ab8ff"/>
  <text x="520" y="78" fill="#8ab8ff" font-size="14" text-anchor="middle">layout(width, lh)</text>
  <text x="520" y="98" fill="#8a8f98" font-size="11" text-anchor="middle">pure arithmetic over</text>
  <text x="520" y="114" fill="#8a8f98" font-size="11" text-anchor="middle">cached widths</text>

  <path d="M610 92 h36" stroke="#8a8f98" fill="none" marker-end="url(#a)"/>
  <text x="694" y="86" fill="#e8e6e1" font-size="13" text-anchor="middle">height,</text>
  <text x="694" y="104" fill="#e8e6e1" font-size="13" text-anchor="middle">lineCount</text>

  <text x="24" y="180" fill="#8a8f98" font-size="12">one-time cost, rerun only on new text</text>
  <path d="M212 172 h180" stroke="#7ee2a8" stroke-dasharray="4 4" fill="none"/>
  <text x="430" y="180" fill="#8a8f98" font-size="12">hot path: rerun per resize — no DOM, no reflow</text>
  <path d="M430 190 h180" stroke="#8ab8ff" stroke-dasharray="4 4" fill="none"/>

  <text x="24" y="222" fill="#8a8f98" font-size="11">nagops.com uses the result as min-height — the typewriter types into space reserved before the first character.</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#8a8f98"/>
    </marker>
  </defs>
</svg>
