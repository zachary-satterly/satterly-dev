<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="760" height="420" rx="10" fill="#0c0e12" stroke="#3a3f47"/>
  <text x="24" y="34" fill="#8a8f98" font-size="12" letter-spacing="2">TANSTACK COMPROMISE — MAY 11, 2026 (SIMPLIFIED)</text>

  <rect x="24" y="56" width="336" height="58" rx="6" fill="none" stroke="#e06c75"/>
  <text x="40" y="80" fill="#e06c75" font-size="13">1 · pull_request_target</text>
  <text x="40" y="99" fill="#8a8f98" font-size="11">privileged job runs fork-controlled code</text>

  <rect x="400" y="56" width="336" height="58" rx="6" fill="none" stroke="#e06c75"/>
  <text x="416" y="80" fill="#e06c75" font-size="13">2 · cache poisoning</text>
  <text x="416" y="99" fill="#8a8f98" font-size="11">attacker content saved across the fork/base boundary</text>

  <rect x="24" y="140" width="336" height="58" rx="6" fill="none" stroke="#e06c75"/>
  <text x="40" y="164" fill="#e06c75" font-size="13">3 · trusted restore</text>
  <text x="40" y="183" fill="#8a8f98" font-size="11">release runner restores the poisoned cache entry</text>

  <rect x="400" y="140" width="336" height="58" rx="6" fill="none" stroke="#e06c75"/>
  <text x="416" y="164" fill="#e06c75" font-size="13">4 · OIDC extraction</text>
  <text x="416" y="183" fill="#8a8f98" font-size="11">payload reads short-lived credential from runner memory</text>

  <rect x="24" y="224" width="712" height="58" rx="6" fill="none" stroke="#e06c75"/>
  <text x="40" y="248" fill="#e06c75" font-size="13">5 · authenticated publish</text>
  <text x="40" y="267" fill="#8a8f98" font-size="11">npm trusted publishing accepts the credential — 84 malicious versions across 42 packages, in ~6 minutes</text>

  <path d="M360 85 h40" stroke="#8a8f98" fill="none" marker-end="url(#b)"/>
  <path d="M568 114 v26 h-208" stroke="#8a8f98" fill="none" marker-end="url(#b)"/>
  <path d="M360 169 h40" stroke="#8a8f98" fill="none" marker-end="url(#b)"/>
  <path d="M568 198 v26" stroke="#8a8f98" fill="none" marker-end="url(#b)"/>

  <text x="24" y="322" fill="#7ee2a8" font-size="12">The release path was authenticated the whole time.</text>
  <text x="24" y="342" fill="#8a8f98" font-size="12">Provenance proves which pipeline published an artifact — not that the pipeline's inputs were safe.</text>

  <text x="24" y="384" fill="#8a8f98" font-size="11">Sources: TanStack postmortem · GHSA-g7cv-rxg3-hmpx · Aikido (373 malicious versions / 169 package names by May 12)</text>

  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#8a8f98"/>
    </marker>
  </defs>
</svg>
