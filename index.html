<style>
  :root {
    --bg: #0c0e12;
    --fg: #e8e6e1;
    --dim: #8a8f98;
    --faint: #3a3f47;
    --accent-sec: #7ee2a8;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #faf9f7; --fg: #1b1d21; --dim: #6b7078; --faint: #d8d5cf; --accent-sec: #0a7d43; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--mono);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  #stage.held { cursor: grabbing; }
  .ch { position: absolute; left: 0; top: 0; white-space: pre; color: var(--fg); font-weight: 600; will-change: transform; line-height: 1; text-shadow: 0 0 .22em var(--bg), 0 0 .22em var(--bg), 0 0 .4em var(--bg), 0 0 .4em var(--bg), 0 0 .7em var(--bg), 0 0 .7em var(--bg); }
  .dog { position: absolute; margin: 0; font-family: var(--mono); line-height: 1; white-space: pre; color: var(--dim); pointer-events: none; }
  .dog b { font-weight: inherit; }
  #dogL { display: none; }
  @media (prefers-color-scheme: light) { #dogD { display: none; } #dogL { display: block; } }
  #shades { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; will-change: transform; }
  #shades rect { fill: #000; shape-rendering: crispEdges; }
  .label { position: fixed; font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); margin: 0; }
  #kicker { left: clamp(20px, 4vw, 48px); top: clamp(20px, 4vh, 40px); }
  nav { position: fixed; left: clamp(20px, 4vw, 48px); bottom: clamp(20px, 4vh, 40px); font-size: 0.9rem; line-height: 1.9; }
  nav a { display: table; color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--faint); line-height: 1.5; margin: .25rem 0; }
  nav a:hover { border-bottom-color: var(--accent-sec); }
  a:focus-visible { outline: 1px solid var(--fg); outline-offset: 4px; }
  @media (max-width: 1040px) { nav { bottom: auto; top: calc(clamp(20px, 4vh, 40px) + 1.8rem); } #about { bottom: auto; top: calc(clamp(20px, 4vh, 40px) + 2.15rem); } }
  @media (max-width: 640px) { .label { font-size: 0.72rem; letter-spacing: 0.14em; } }
  #about { position: fixed; right: clamp(20px, 4vw, 48px); bottom: clamp(20px, 4vh, 40px); font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--faint); text-decoration: none; }
  #about:hover, #about:focus-visible { color: var(--dim); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
