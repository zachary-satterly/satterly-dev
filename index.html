<style>
  :root {
    color-scheme: dark;
    --bg: #0c0e12;
    --fg: #e8e6e1;
    --dim: #8a8f98;
    --faint: #3a3f47;
    --accent-sec: #7ee2a8;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--mono);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  #stage.held { cursor: grabbing; }
  .ch { position: absolute; left: 0; top: 0; white-space: pre; color: var(--fg); font-weight: 600; will-change: transform; line-height: 1; pointer-events: none; text-shadow: 0 0 .22em var(--bg), 0 0 .22em var(--bg), 0 0 .4em var(--bg), 0 0 .4em var(--bg), 0 0 .7em var(--bg), 0 0 .7em var(--bg); }
  .dog { position: absolute; margin: 0; font-family: var(--mono); line-height: 1; white-space: pre; color: var(--dim); pointer-events: none; }
  .dog.light { display: none; }
  .prop { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; will-change: transform; }
  .prop rect { fill: #000; shape-rendering: crispEdges; }
  .prop.gold path { fill: #d9a520; }
  .crit { position: absolute; left: 0; top: 0; line-height: 1; font-weight: 700; color: var(--accent-sec); pointer-events: none; will-change: transform; text-shadow: 0 0 .3em var(--bg), 0 0 .3em var(--bg); }
  .crit.got { color: var(--fg); }
  .tally { position: absolute; left: 50%; bottom: clamp(20px, 4vh, 40px); transform: translateX(-50%); white-space: nowrap; text-shadow: 0 0 .5em var(--bg), 0 0 .5em var(--bg), 0 0 1em var(--bg); }
  .heart { position: absolute; left: 0; top: 0; pointer-events: none; }
  .heart rect { fill: #e5484d; shape-rendering: crispEdges; }
  .line { position: absolute; margin: 0; transform: translateX(-50%); white-space: nowrap; font-weight: 600; color: var(--faint); pointer-events: none; text-shadow: 0 0 .3em var(--bg), 0 0 .3em var(--bg), 0 0 .6em var(--bg), 0 0 .6em var(--bg); }
  .line b { color: var(--fg); font-weight: inherit; }
  #pager { right: clamp(20px, 4vw, 48px); top: clamp(20px, 4vh, 40px); display: flex; gap: .9em; align-items: center; }
  #pager button { font: inherit; color: var(--dim); background: none; border: 0; padding: 0 .3em; cursor: pointer; font-size: 1.2rem; line-height: 1; letter-spacing: 0; }
  #pager button:hover { color: var(--fg); }
  button:focus-visible { outline: 1px solid var(--fg); outline-offset: 4px; }
  .label { position: fixed; font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); margin: 0; }
  nav { position: fixed; left: clamp(20px, 4vw, 48px); bottom: clamp(20px, 4vh, 40px); font-size: 0.9rem; line-height: 1.9; }
  nav a { display: table; color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--faint); line-height: 1.5; margin: .25rem 0; }
  nav a:hover { border-bottom-color: var(--accent-sec); }
  a:focus-visible { outline: 1px solid var(--fg); outline-offset: 4px; }
  #about { position: fixed; right: clamp(20px, 4vw, 48px); bottom: clamp(20px, 4vh, 40px); font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--faint); text-decoration: none; }
  #about:hover, #about:focus-visible { color: var(--dim); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  @media (max-width: 1040px) { nav { bottom: auto; top: calc(clamp(20px, 4vh, 40px) - .45rem); } #about { bottom: auto; top: clamp(20px, 4vh, 40px); } #pager { top: auto; bottom: clamp(20px, 4vh, 40px); } }
  @media (max-width: 640px) { .label { font-size: 0.72rem; letter-spacing: 0.14em; } }
</style>

<h1 class="sr">Zachary Satterly builds and secures software. Now: agent and AI security. Each sentence sits with a character-art dog: He hunts bugs. I hunt squirrels. Say hello on GitHub.</h1>
